name: Discover Creative Center

# Manual only: Actions tab > Discover Creative Center > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Visit Creative Center and save what it loads
        run: npm run discover

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery
          path: collector/out
          retention-days: 7
